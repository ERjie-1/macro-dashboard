name: Refresh Dashboard Data

on:
  schedule:
    # Run Mon-Fri at 23:00 UTC — post US market close + post FRED release
    # EDT (Mar-Nov): 23:00 UTC = 19:00 EDT
    # EST (Nov-Mar): 23:00 UTC = 18:00 EST
    - cron: '0 23 * * 1-5'
  workflow_dispatch: # Allow manual trigger

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r data/requirements.txt

      - name: Fetch macro dashboard data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python data/fetch_data.py

      - name: Fetch positioning & flow data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python data/fetch_positioning.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f public/data/dashboard.json public/data/positioning.json public/data/macro_factors_history.jsonl public/data/positioning_history.jsonl
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: auto-update dashboard data $(date -u +%Y-%m-%d)"
          git push
