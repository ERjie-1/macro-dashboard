name: Refresh Dashboard Data

on:
  schedule:
    # 05:23 Asia/Shanghai, after US close in both EST and EDT.
    # GitHub schedule is best effort; local dispatch provides a second trigger.
    - cron: '23 21 * * 1-5'
  workflow_dispatch: # Allow manual trigger

# Serialize schedule and local dispatch; never cancel an active data refresh.
concurrency:
  group: dashboard-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r data/requirements.txt

      - name: Fetch macro dashboard data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python data/fetch_data.py

      - name: Fetch positioning & flow data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python data/fetch_positioning.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f public/data/dashboard.json public/data/positioning.json public/data/macro_factors_history.jsonl public/data/positioning_history.jsonl
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: auto-update dashboard data $(date -u +%Y-%m-%d)"
          git push
